name: Lint, Test and Deploy
on:
  pull_request:
    types: 
      - opened
  workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
            - name: Install dependencies
              run: npm ci
            - name: Build
              run: npm run build
    lint:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
            - name: Install dependencies
              run: npm ci
            - name: Test
              run: npm run lint            
    tests:
        needs: lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
            - name: Install dependencies
              run: npm ci
            - name: Test
              run: npm run test
    deploy:
        needs: tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
            - name: Install dependencies
              run: echo "Deploy"
